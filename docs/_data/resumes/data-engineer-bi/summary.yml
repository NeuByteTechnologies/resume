summary: "Data Engineer with a strong foundation in SQL, ETL development, data modeling,
  and workflow automation. I specialize in building reliable data pipelines,
  transforming legacy processes into structured, repeatable systems, and
  supporting analytics teams with clean, well-modeled datasets. My background in
  systems analysis gives me a unique advantage: I understand how data flows
  through enterprise systems, how business rules shape transformations, and how
  to document and operationalize data processes for long-term scalability."
