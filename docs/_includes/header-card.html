<header class="resume-header">
  <h1 class="resume-name">{{ profile.name }}</h1>
  <h2 class="resume-title">{{profile.title }}</h2>

  <div class="resume-contact">
    <span>{{ profile.location }}</span>
    <span>{{ profile.phone }}</span>
    <span><a href="mailto:{{ site.data.profile.email }}">{{ profile.email }}</a></span>
    <span><a href="{{ site.data.profile.linkedin}}" target="_blank">{{ profile.linkedin }}</a></span>
    <span><a href="{{ site.data.profile.website }}" target="_blank">{{ profile.website }}</a></span>
  </div>
</header>
